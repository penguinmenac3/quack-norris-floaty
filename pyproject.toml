[project]
name = "quack-norris"
version = "0.0.1"
license = "MIT"
readme = "README.md"
description = "A floaty that allows you to talk to your AI using quack norris chat ui."
keywords = ["quack", "norris", "ai", "agentic", "rubber duck", "debugging", "assistant"]
authors = [{ name = "Michael Fuerst" }]
maintainers = [
    { name = "Michael Fuerst" },
]
requires-python = ">=3.10"
dependencies = [
    "setproctitle>=1.3.4",
    "pyside6>=6.8.0.1",
]
[project.optional-dependencies]
dev = [
    "flake8>=7.1.1",
    "pytest>=8.3.4"
]

[project.scripts]
quack-norris-ui = "quack_norris_ui.__main__:ui"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"